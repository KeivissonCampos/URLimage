<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Camera WebView</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    padding: 20px;
    text-align: center;
}
#preview {
    width: 90%;
    max-width: 380px;
    margin-top: 20px;
    border-radius: 8px;
    border: 2px solid #ccc;
}
#upload {
    display: none;
}
button {
    padding: 12px 25px;
    background: #0078ff;
    border: none;
    border-radius: 8px;
    color: white;
    font-size: 18px;
}
</style>

</head>
<body>

<h2>Abrir câmera no WebView</h2>

<p>Clique abaixo para tirar uma foto:</p>

<input id="upload" type="file" accept="image/*" capture="camera">

<button onclick="openCamera()">📸 Abrir Câmera</button>

<img id="preview">

<script>
function openCamera() {
    document.getElementById("upload").click();
}

document.getElementById("upload").addEventListener("change", function(event) {
    const file = event.target.files[0];
    if (!file) return;

    const img = document.getElementById("preview");
    img.src = URL.createObjectURL(file);
});
</script>

</body>
</html>
