<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Camera AppInventor</title>
    <style>
        video,
        canvas {
            width: 100%;
        }
    </style>
</head>

<body>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" } // câmera traseira
                });

                const video = document.getElementById("video");
                video.srcObject = stream;

                video.onloadedmetadata = () => {
                    // Espera 1 segundo e tira foto automaticamente
                    setTimeout(takePhoto, 1000);
                };

            } catch (err) {
                alert("Erro ao acessar câmera: " + err);
            }
        }

        function takePhoto() {
            const video = document.getElementById("video");
            const canvas = document.getElementById("canvas");
            const ctx = canvas.getContext("2d");

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            ctx.drawImage(video, 0, 0);

            // Converte imagem para Base64
            const data = canvas.toDataURL("image/jpeg");

            // Envia para App Inventor
            window.AppInventor.setWebViewString(data);
        }

        startCamera();
    </script>

</body>

</html>
