<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Camera AI2</title>
    <style>
        video {
            width: 100%;
        }

        canvas {
            display: none;
        }
    </style>
</head>

<body>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <script>

        document.addEventListener("DOMContentLoaded", () => {
            // App Inventor envia sinal via WebViewString
            document.addEventListener("message", (e) => {
                if (e.data === "openCamera") startCamera();
            });
        });

        // Para App Inventor (compatibilidade extra)
        window.addEventListener("message", (e) => {
            if (e.data === "openCamera") startCamera();
        });

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" }
                });

                const video = document.getElementById("video");
                video.srcObject = stream;

                video.onloadedmetadata = () => {
                    setTimeout(takePhoto, 800); // tira foto automatico
                };

            } catch (err) {
                window.AppInventor.setWebViewString("ERRO:" + err);
            }
        }

        function takePhoto() {
            const video = document.getElementById("video");
            const canvas = document.getElementById("canvas");
            const ctx = canvas.getContext("2d");

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            ctx.drawImage(video, 0, 0);
            const img = canvas.toDataURL("image/jpeg");

            window.AppInventor.setWebViewString(img);
        }
    </script>

</body>

</html>
